<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Finance OS">
  <style>
    .fos-tile, .fos-arm, .fos-bar { transform-box: fill-box; }
    .fos-tile { transform-origin: center; animation: fos-pop 560ms cubic-bezier(.2,.9,.25,1.15) both; }
    .fos-arm { transform-origin: left center; animation: fos-sweep 620ms cubic-bezier(.16,.9,.24,1) both; }
    .fos-arm-top { animation-delay: 260ms; }
    .fos-arm-mid { animation-delay: 400ms; }
    .fos-bar { transform-origin: center bottom; animation: fos-grow 520ms cubic-bezier(.2,.9,.3,1.35) both; }
    .fos-bar-1 { animation-delay: 760ms; }
    .fos-bar-2 { animation-delay: 870ms; }
    .fos-bar-3 { animation-delay: 980ms; }
    @keyframes fos-pop { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
    @keyframes fos-sweep { from { opacity: 0; transform: translateX(-56px) skewX(-14deg); } to { opacity: 1; transform: none; } }
    @keyframes fos-grow { from { opacity: 0; transform: scaleY(0); } 40% { opacity: 1; } to { opacity: 1; transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .fos-tile, .fos-arm, .fos-bar { animation: none; } }
  </style>
  <rect class="fos-tile" width="512" height="512" rx="138" fill="#0532D4"/>
  <path class="fos-arm fos-arm-top" fill="#FFFFFF" d="M210.5 94.3 H422 Q426.8 94.3 424.9 99 L413.9 132.5 Q401.9 166 361.3 168.4 H201 Q157.9 169.9 105.3 248.8 L124.4 155.5 Q136.4 97.1 210.5 94.3 Z"/>
  <path class="fos-arm fos-arm-mid" fill="#FFFFFF" d="M201 201 H378 L357.9 234.5 Q335 270.4 297.6 272.3 H201 L173.2 357.4 Q160.3 390.9 126.8 392.4 H82.3 L99.5 279.9 Q114.8 205.8 201 201 Z"/>
  <rect class="fos-bar fos-bar-1" x="219.2" y="327.8" width="49.8" height="63.6" rx="15" fill="#86EDB4"/>
  <rect class="fos-bar fos-bar-2" x="281.4" y="299.1" width="49.8" height="92.3" rx="15" fill="#FFAE73"/>
  <rect class="fos-bar fos-bar-3" x="343.6" y="270.8" width="48.8" height="120.6" rx="15" fill="#FFFFFF"/>
</svg>
