    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Finance OS</title>
    <meta name="description" content="Track income, spending and goals. Works offline." />
    <meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
    <script>
      // Before first paint: apply a saved Light/Dark choice (src/lib/theme.ts), and skip the launch
      // splash on desktop or if it already played this session (src/lib/splash.ts).
      try {
        var t = localStorage.getItem('finance-os-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#0D1117' : '#F3F5F9';
          });
        }
      } catch (e) {}
      try {
        if (sessionStorage.getItem('finance-os-splash') || matchMedia('(min-width: 1024px)').matches) {
          document.documentElement.classList.add('no-splash');
        }
      } catch (e) {}
    </script>
    <style>
      /* Launch splash: the brand intro, shown until the app has rendered. Colours match tokens.css --bg. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--bg, #f3f5f9);
        color: var(--ink, #121722);
        font: 700 20px/1 Figtree, system-ui, sans-serif;
        letter-spacing: -0.01em;
        transition: opacity 320ms ease, visibility 320ms;
        /* Safety net: never cover the app for more than 6 s, even if JavaScript fails to load. */
        animation: splash-giveup 0s 6s forwards;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash { background: var(--bg, #0d1117); color: var(--ink, #eceff4); }
      }
      :root[data-theme='dark'] #splash { background: var(--bg, #0d1117); color: var(--ink, #eceff4); }
      :root[data-theme='light'] #splash { background: var(--bg, #f3f5f9); color: var(--ink, #121722); }
      .no-splash #splash { display: none; }
      #splash.splash-out { opacity: 0; visibility: hidden; }
      #splash .splash-name { opacity: 0; animation: splash-name 420ms 1000ms ease-out forwards; }
      @keyframes splash-name { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-giveup { to { opacity: 0; visibility: hidden; } }
      /* Logo intro, from the brand pack (src/components/brand/AnimatedLogo.css) */
      #splash svg { display: block; overflow: visible; }
      #splash .fos-tile, #splash .fos-arm, #splash .fos-bar { transform-box: fill-box; }
      #splash .fos-tile { transform-origin: center; animation: fos-pop 560ms cubic-bezier(.2,.9,.25,1.15) both; }
      #splash .fos-arm { transform-origin: left center; animation: fos-sweep 620ms cubic-bezier(.16,.9,.24,1) both; }
      #splash .fos-arm-top { animation-delay: 260ms; }
      #splash .fos-arm-mid { animation-delay: 400ms; }
      #splash .fos-bar { transform-origin: center bottom; animation: fos-grow 520ms cubic-bezier(.2,.9,.3,1.35) both; }
      #splash .fos-bar-1 { animation-delay: 760ms; }
      #splash .fos-bar-2 { animation-delay: 870ms; }
      #splash .fos-bar-3 { animation-delay: 980ms; }
      @keyframes fos-pop { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: scale(1); } }
      @keyframes fos-sweep { from { opacity: 0; transform: translateX(-56px) skewX(-14deg); } to { opacity: 1; transform: none; } }
      @keyframes fos-grow { from { opacity: 0; transform: scaleY(0); } 40% { opacity: 1; } to { opacity: 1; transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .fos-tile, #splash .fos-arm, #splash .fos-bar, #splash .splash-name { animation: none; opacity: 1; }
        #splash { transition: none; }
      }
    </style>
