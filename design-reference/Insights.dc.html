<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insights</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; {{vars}}">
  <main style="position: absolute; inset: 0 0 84px 0; overflow-y: auto; padding: 24px 20px 88px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Insights</h1>
      <button style="border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; min-height: 40px; padding: 0 14px; font: 600 13px Figtree, sans-serif; cursor: pointer">Export</button>
    </header>

    <section aria-label="Financial health" style="display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line)">
      <div style="display: flex; align-items: center; gap: 16px">
        <div role="img" aria-label="Health score 82 out of 100" style="width: 84px; height: 84px; border-radius: 50%; background: conic-gradient(var(--pos) 82%, var(--raised) 0); display: flex; align-items: center; justify-content: center; flex: none">
          <span style="width: 68px; height: 68px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 28px; font-weight: 700">82</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted)">Health score</span>
          <span style="font-size: 20px; font-weight: 700">Very good</span>
          <span style="font-size: 13px; color: var(--muted)">Based on September</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{factors}}" as="f" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--raised)">
            <span style="font-size: 12px; color: var(--muted)">{{f.label}}</span>
            <span style="font-size: 14px; font-weight: 700; color: var(--pos)">{{f.value}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="Savings streak" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: var(--posSoft)">
      <span style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 36px; font-weight: 700; color: var(--pos); line-height: 1">12</span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">day savings streak</span>
        <span style="font-size: 13px; color: var(--muted)">Days in a row you've put money aside.</span>
      </div>
    </section>

    <section aria-label="October calendar" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700">October</h2>
        <span style="font-size: 12px; color: var(--muted)">4 paydays</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-variant-numeric: tabular-nums">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="7">
          <span style="font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 4px">{{w}}</span>
        </sc-for>
        <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
          <span style="height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 13px; font-weight: {{d.weight}}; background: {{d.bg}}; color: {{d.fg}}">{{d.n}}</span>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
        <sc-for list="{{paydays}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums">
            <span><b>{{p.date}}</b> <span style="color: var(--muted)">· {{p.name}}</span></span>
            <span style="font-weight: 700; color: var(--pos)">{{p.amt}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 156px; pointer-events: none">
    <dc-import name="TabBar" active="insights" dark="{{dark}}" hint-size="390px,156px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    const light = { bg: '#F3F5F9', surface: '#FFFFFF', raised: '#E9EDF4', ink: '#121722', muted: '#566073', line: '#DFE4EC', accent: '#2B52DD', accentSoft: '#E4EAFC', onAccent: '#FFFFFF', pos: '#16784A', posSoft: '#E1F3E9', neg: '#B4470D', negSoft: '#FBEADC' };
    const night = { bg: '#0D1117', surface: '#161B24', raised: '#212835', ink: '#ECEFF4', muted: '#9BA5B6', line: '#283041', accent: '#86A2FF', accentSoft: '#1B2747', onAccent: '#0D1117', pos: '#58CC90', posSoft: '#12301F', neg: '#F39A66', negSoft: '#3A2314' };
    const t = dark ? night : light;
    return Object.keys(t).map(function (k) { return '--' + k + ': ' + t[k]; }).join('; ');
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const pay = { 1: 1, 3: 1, 15: 1, 18: 1 };
    const days = [{ n: '', bg: 'transparent', fg: 'var(--ink)', weight: '500' }, { n: '', bg: 'transparent', fg: 'var(--ink)', weight: '500' }];
    for (let i = 1; i <= 31; i++) {
      days.push(pay[i] ? { n: String(i), bg: 'var(--accent)', fg: 'var(--onAccent)', weight: '700' } : { n: String(i), bg: 'transparent', fg: 'var(--ink)', weight: '500' });
    }
    return {
      dark: dark,
      vars: this.theme(dark),
      factors: [
        { label: 'Savings rate', value: '25%' },
        { label: 'Spending control', value: 'Good' },
        { label: 'Income stability', value: 'Stable' },
        { label: 'Goal progress', value: 'On track' }
      ],
      week: ['S', 'M', 'T', 'W', 'T', 'F', 'S'],
      days: days,
      paydays: [
        { date: 'Oct 1', name: 'Main Job', amt: '₱13,000' },
        { date: 'Oct 3', name: 'Part-Time Job', amt: '₱4,000' },
        { date: 'Oct 15', name: 'Main Job', amt: '₱13,000' },
        { date: 'Oct 18', name: 'Part-Time Job', amt: '₱4,000' }
      ]
    };
  }
}
</script>
</body>
</html>
