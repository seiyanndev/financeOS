<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; {{vars}}">
  <main style="position: absolute; inset: 0 0 84px 0; overflow-y: auto; padding: 24px 20px 88px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">

    <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Goals</h1>
      <button style="border: 0; background: var(--accentSoft); color: var(--accent); border-radius: 12px; min-height: 40px; padding: 0 14px; font: 700 13px Figtree, sans-serif; cursor: pointer">New goal</button>
    </header>

    <section aria-label="All goals" style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted)">Saved toward goals</span>
      <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
        <span style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums">₱78,500</span>
        <span style="font-size: 14px; color: var(--muted)">of ₱310,000</span>
      </div>
      <div style="height: 10px; border-radius: 6px; background: var(--raised); overflow: hidden"><div style="width: 25%; height: 100%; background: var(--accent); border-radius: 6px"></div></div>
    </section>

    <section aria-label="Goal list" style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="3">
        <article style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line)">
          <div style="display: flex; align-items: center; gap: 14px">
            <div role="img" aria-label="{{g.pctLabel}}" style="width: 56px; height: 56px; border-radius: 50%; background: {{g.ring}}; display: flex; align-items: center; justify-content: center; flex: none">
              <span style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.pct}}%</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{g.name}}</h2>
              <span style="font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums"><b style="color: var(--ink)">{{g.saved}}</b> of {{g.target}}</span>
              <span style="font-size: 12px; color: var(--muted)">{{g.left}} to go</span>
            </div>
          </div>
          <div style="display: flex; gap: 8px">
            <button style="flex: 1; min-height: 44px; border-radius: 12px; border: 0; background: var(--accent); color: var(--onAccent); font: 700 14px Figtree, sans-serif; cursor: pointer">Add money</button>
            <button style="flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 14px Figtree, sans-serif; cursor: pointer">Set target date</button>
          </div>
        </article>
      </sc-for>
    </section>
  </main>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 156px; pointer-events: none">
    <dc-import name="TabBar" active="goals" dark="{{dark}}" hint-size="390px,156px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    const light = { bg: '#F3F5F9', surface: '#FFFFFF', raised: '#E9EDF4', ink: '#121722', muted: '#566073', line: '#DFE4EC', accent: '#2B52DD', accentSoft: '#E4EAFC', onAccent: '#FFFFFF', pos: '#16784A', posSoft: '#E1F3E9', neg: '#B4470D', negSoft: '#FBEADC' };
    const night = { bg: '#0D1117', surface: '#161B24', raised: '#212835', ink: '#ECEFF4', muted: '#9BA5B6', line: '#283041', accent: '#86A2FF', accentSoft: '#1B2747', onAccent: '#0D1117', pos: '#58CC90', posSoft: '#12301F', neg: '#F39A66', negSoft: '#3A2314' };
    const t = dark ? night : light;
    return Object.keys(t).map(function (k) { return '--' + k + ': ' + t[k]; }).join('; ');
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const peso = function (n) { return '₱' + n.toLocaleString('en-US'); };
    const goals = [
      { name: 'Laptop Fund', saved: 25000, target: 60000 },
      { name: 'Emergency Fund', saved: 18500, target: 100000 },
      { name: 'Japan Trip', saved: 35000, target: 150000 }
    ].map(function (g) {
      const pct = Math.round(g.saved / g.target * 100);
      return { name: g.name, saved: peso(g.saved), target: peso(g.target), left: peso(g.target - g.saved), pct: pct, pctLabel: pct + '% saved', ring: 'conic-gradient(var(--accent) ' + pct + '%, var(--raised) 0)' };
    });
    return { dark: dark, vars: this.theme(dark), goals: goals };
  }
}
</script>
</body>
</html>
