<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; {{vars}}">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <dc-import name="Main" dark="{{dark}}" hint-size="390px,844px"></dc-import>
  </div>
  <a href="Main.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(8, 12, 22, 0.48)"></a>

  <section role="dialog" aria-label="Add a transaction" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px; border-radius: 28px 28px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line)"></span>

    <div role="group" aria-label="Type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--raised)">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="min-height: 40px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font: 700 14px Figtree, sans-serif; cursor: pointer; box-shadow: {{t.shadow}}">{{t.label}}</button>
      </sc-for>
    </div>

    <label for="add-amount" style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-size: 13px; color: var(--muted); font-weight: 600">Amount</span>
      <span style="display: flex; align-items: baseline; gap: 4px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -0.03em; color: {{amtColor}}">
        <span>₱</span>
        <input id="add-amount" inputmode="decimal" value="350" style="width: 140px; border: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-align: left; outline: none; padding: 0">
      </span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: var(--muted)">Category</span>
      <div role="group" aria-label="Category" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 600 13px Figtree, sans-serif; cursor: pointer">{{c.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label for="add-note" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted)">Note
        <input id="add-note" value="GrabFood" style="min-height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 500 15px Figtree, sans-serif">
      </label>
      <label for="add-date" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted)">Date
        <input id="add-date" value="Today, Sep 23" style="min-height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 500 15px Figtree, sans-serif">
      </label>
    </div>

    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: var(--accent); color: var(--onAccent); font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark) {
    const light = { bg: '#F3F5F9', surface: '#FFFFFF', raised: '#E9EDF4', ink: '#121722', muted: '#566073', line: '#DFE4EC', accent: '#2B52DD', accentSoft: '#E4EAFC', onAccent: '#FFFFFF', pos: '#16784A', posSoft: '#E1F3E9', neg: '#B4470D', negSoft: '#FBEADC' };
    const night = { bg: '#0D1117', surface: '#161B24', raised: '#212835', ink: '#ECEFF4', muted: '#9BA5B6', line: '#283041', accent: '#86A2FF', accentSoft: '#1B2747', onAccent: '#0D1117', pos: '#58CC90', posSoft: '#12301F', neg: '#F39A66', negSoft: '#3A2314' };
    const t = dark ? night : light;
    return Object.keys(t).map(function (k) { return '--' + k + ': ' + t[k]; }).join('; ');
  }
  renderVals() {
    const self = this;
    const dark = this.props.dark ?? false;
    const s = this.state || {};
    const type = s.type || 'expense';
    const sets = {
      expense: ['Food', 'Bills', 'Transport', 'Shopping', 'Health', 'Other'],
      income: ['Main Job', 'Part-Time Job', 'Other'],
      goal: ['Laptop Fund', 'Emergency Fund', 'Japan Trip']
    };
    const list = sets[type];
    const cat = list.indexOf(s.cat) >= 0 ? s.cat : list[0];
    const types = [['expense', 'Expense'], ['income', 'Income'], ['goal', 'To goal']].map(function (t) {
      const on = t[0] === type;
      return { label: t[1], on: on ? 'true' : 'false', bg: on ? 'var(--surface)' : 'transparent', fg: on ? 'var(--ink)' : 'var(--muted)', shadow: on ? '0 1px 3px rgba(16, 24, 40, 0.14)' : 'none', pick: function () { self.setState({ type: t[0], cat: null }); } };
    });
    const cats = list.map(function (c) {
      const on = c === cat;
      return { label: c, on: on ? 'true' : 'false', bg: on ? 'var(--ink)' : 'var(--surface)', fg: on ? 'var(--bg)' : 'var(--ink)', border: on ? 'var(--ink)' : 'var(--line)', pick: function () { self.setState({ cat: c }); } };
    });
    const ctas = { expense: 'Save expense', income: 'Save income', goal: 'Move to ' + cat };
    const colors = { expense: 'var(--neg)', income: 'var(--pos)', goal: 'var(--accent)' };
    return { dark: dark, vars: this.theme(dark), types: types, cats: cats, cta: ctas[type], amtColor: colors[type] };
  }
}
</script>
</body>
</html>
